[pytest]
# Les tests se lancent depuis la racine du dépôt : python -m pytest
testpaths = tests
# La racine du dépôt passe en premier dans le chemin de Python :
# « from src.config import ... » trouve toujours le code du projet.
pythonpath = .
addopts = -ra --strict-markers
markers =
    unitaire: une fonction testée seule, sur de petites données connues
    integration: plusieurs modules enchaînés
